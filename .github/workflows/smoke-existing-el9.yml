name: Smoke existing unsigned RPMs in disposable AlmaLinux 9 VM

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: existing-el9-compatibility-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch only the approved driver ZIP before its download URL expires
        env:
          EL9_DRIVER_ARTIFACT_URL: ${{ secrets.EL9_DRIVER_ARTIFACT_URL }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, urllib.parse
          value = urllib.parse.urlsplit(os.environ['EL9_DRIVER_ARTIFACT_URL'])
          if value.scheme != 'https' or not value.hostname or not value.hostname.endswith('.blob.core.windows.net') or value.username or value.password:
              raise SystemExit('Missing authorized short-lived artifact URL')
          PY
          curl --fail --silent --show-error --max-time 120 "$EL9_DRIVER_ARTIFACT_URL" --output "$RUNNER_TEMP/el9-driver.zip"
          printf '%s  %s\n' '1902ecee45ac064412e4b5ce1c7d39c1909fc20544744792c84d1fb041975a73' "$RUNNER_TEMP/el9-driver.zip" | sha256sum --check --strict
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install disposable VM host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils genisoimage
      - name: Test existing hash-pinned driver/runtime/app RPMs
        env:
          GH_TOKEN: ${{ github.token }}
          EL9_DRIVER_ARTIFACT_FILE: ${{ runner.temp }}/el9-driver.zip
        run: python3 scripts/run-github-el9-smoke.py run "$RUNNER_TEMP/lto-el9-smoke"
      - name: Retain actual VM report and diagnostics, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: existing-el9-compatibility-smoke
          path: |
            ${{ runner.temp }}/lto-el9-smoke/report.json
            ${{ runner.temp }}/lto-el9-smoke/environment.json
            ${{ runner.temp }}/lto-el9-smoke/serial.log
          if-no-files-found: warn
          retention-days: 7
