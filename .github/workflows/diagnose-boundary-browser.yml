name: Frozen boundary browser diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out diagnostic tools
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: diagnostic-tools
          persist-credentials: false
      - name: Check out frozen published subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 4507cd23e96fef48dd3099d0da69bb7cda3a9a27
          path: frozen-subject
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install frozen subject test dependencies
        working-directory: frozen-subject
        run: python -m pip install '.[test]'
      - name: Observe the original test once
        env:
          DIAGNOSTIC_TOOLS_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # GNU timeout creates a dedicated process group; bound this probe only.
          timeout --signal=TERM --kill-after=5s 60s \
            python diagnostic-tools/scripts/observe-boundary-browser.py \
              --subject "$GITHUB_WORKSPACE/frozen-subject" \
              --tools-commit "$DIAGNOSTIC_TOOLS_COMMIT"
